---
# Per environment values which override defaults in hmpps-launchpad-auth/values.yaml

purge_inactive_users_schedule: "0 13 * * 1-5"

purge_stale_sso_tokens_schedule: "05-55/10 07-21 * * 1-5"

generic-service:
  replicaCount: 2
  serviceAccountName: hmpps-launchpad-staging

  # Primary ingress: Frontend HTTPS access
  ingress:
    host: launchpad-auth-staging.hmpps.service.justice.gov.uk

  scheduledDowntime:
    enabled: true

  allowlist:
    model-office-vm: 172.187.72.182
    groups:
      - internal

  env:
    APPLICATIONINSIGHTS_CONFIGURATION_FILE: applicationinsights.dev.json
    SPRING_PROFILES_ACTIVE: "staging"
    ENVIRONMENT_NAME: "staging"

# CloudPlatform AlertManager receiver to route prometheus alerts to slack
# See https://user-guide.cloud-platform.service.justice.gov.uk/documentation/monitoring-an-app/how-to-create-alarms.html#creating-your-own-custom-alerts
generic-prometheus-alerts:
  businessHoursOnly: true
